# Homologação (SCRUM-93): uma VM rodando Postgres, back-end, painel de curadoria e Caddy.
#
# Não substitui o docker-compose.yml, que sobe só o banco local. Este arquivo vive no
# servidor e sobe com:
#
#   docker compose -f docker-compose.prod.yml --env-file .env.producao run --rm migracao
#   docker compose -f docker-compose.prod.yml --env-file .env.producao up -d --build
#
# A migração roda ANTES e em comando separado de propósito: se ela falhar, o back-end
# antigo continua no ar servindo a versão anterior, em vez de o ambiente ficar fora.

name: lumens-homologacao

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    # Só o arquivo admin: owner do cluster e senhas dos papéis restritos.
    env_file:
      - .env.producao.admin
    volumes:
      - lumens-pgdata:/var/lib/postgresql/data
    # Sem `ports`: o banco só existe dentro da rede do compose. Publicar 5432 aqui o
    # deixaria alcançável pela internet assim que o security group abrisse a porta —
    # é o critério "o banco não aceita conexão vinda da internet".
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12

  # Perfil próprio para não subir junto no `up`: é tarefa de uma vez só, chamada pelo
  # deploy com `run --rm`, cujo código de saída decide se o deploy continua.
  migracao:
    profiles: ['ferramentas']
    build: .
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    # Tarefa privilegiada e efêmera: é o único serviço que enxerga os dois arquivos.
    env_file:
      - .env.producao
      - .env.producao.admin
    # Provisiona os dois logins restritos (lumens_app e lumens_site) e aplica as migrações.
    # O provision é idempotente, então roda a cada deploy sem efeito colateral.
    command: sh -c 'pnpm db:provision && pnpm db:migrate'

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.producao
    # Sem `ports`: quem fala com a internet é o Caddy.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/saude'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Painel de curadoria. Fica aqui, e não na Vercel, porque precisa do banco e o banco não tem
  # porta publicada. Usa o mesmo .env.producao do back-end (DATABASE_URL de lumens_app,
  # CHAVE_HMAC, EMAIL_*) mais o AUTH_SECRET, que só ele lê.
  painel:
    build:
      context: .
      dockerfile: apps/painel/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.producao
    environment:
      # O link do e-mail é montado a partir desta URL. Atrás do Caddy o Auth.js só confia no
      # Host repassado com AUTH_TRUST_HOST; fixar a URL evita depender do cabeçalho.
      AUTH_URL: https://painel.${DOMINIO:?defina DOMINIO no .env.producao}
      AUTH_TRUST_HOST: 'true'
    # Sem `ports`: quem fala com a internet é o Caddy.
    healthcheck:
      # /api/auth/providers monta a configuração do login: responde 500 se faltar variável
      # (DATABASE_URL, CHAVE_HMAC, EMAIL_*, AUTH_SECRET), não só se o processo cair.
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3002/api/auth/providers'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMINIO: ${DOMINIO:?defina DOMINIO no .env.producao}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Os certificados do Let's Encrypt moram aqui. Perder este volume faz o Caddy
      # pedir tudo de novo, e o Let's Encrypt limita emissões por semana.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
      - painel

  # WhatsApp não oficial pela Evolution API (SCRUM-275). Só sobe com o perfil `evolution`, que o
  # deploy liga quando o .env.producao tem CANAL_WHATSAPP=evolution. Passo a passo, pareamento por QR
  # e troca de chip: docs/operacao/evolution.md
  #
  # Banco próprio, separado do do Lumens: guarda só a sessão do WhatsApp (as chaves do aparelho
  # conectado). Mensagens, contatos e conversas NÃO são gravados (DATABASE_SAVE_DATA_* abaixo).
  evolution-postgres:
    profiles: ['evolution']
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_PG_SENHA:-}
      POSTGRES_DB: evolution
    volumes:
      - evolution-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U evolution -d evolution']
      interval: 5s
      timeout: 5s
      retries: 12

  evolution:
    profiles: ['evolution']
    # Versão fixada por tag E digest (v2.3.7, Baileys 7.0.0-rc.9). Não atualize perto da demo:
    # cada versão nova da Baileys muda o comportamento do WhatsApp Web.
    image: evoapicloud/evolution-api:v2.3.7@sha256:1bd8afc4a6cf48822e6cf02469aeae7bd35a12a6b616eacd1291926307f4d339
    restart: unless-stopped
    depends_on:
      evolution-postgres:
        condition: service_healthy
    # Só no loopback da VM, para o pareamento por túnel SSH. O back-end fala com ela pela rede
    # interna (http://evolution:8080), e ela manda o webhook para http://backend:3000.
    ports:
      - '127.0.0.1:8081:8080'
    environment:
      SERVER_URL: http://localhost:8081
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: 'false'
      TELEMETRY_ENABLED: 'false'
      LOG_LEVEL: ERROR,WARN
      LOG_BAILEYS: error
      LOG_COLOR: 'false'
      DEL_INSTANCE: 'false'
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_PG_SENHA:-}@evolution-postgres:5432/evolution?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: lumens
      DATABASE_SAVE_DATA_INSTANCE: 'true'
      DATABASE_SAVE_DATA_NEW_MESSAGE: 'false'
      DATABASE_SAVE_MESSAGE_UPDATE: 'false'
      DATABASE_SAVE_DATA_CONTACTS: 'false'
      DATABASE_SAVE_DATA_CHATS: 'false'
      DATABASE_SAVE_DATA_LABELS: 'false'
      DATABASE_SAVE_DATA_HISTORIC: 'false'
      DATABASE_SAVE_IS_ON_WHATSAPP: 'false'
      CACHE_REDIS_ENABLED: 'false'
      CACHE_LOCAL_ENABLED: 'true'
      WEBHOOK_GLOBAL_ENABLED: 'false'
      CONFIG_SESSION_PHONE_CLIENT: Lumens
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_LIMIT: '30'
    volumes:
      - evolution-instances:/evolution/instances
    # A v2.3.7 escreve no stdout cada mensagem recebida, com número e texto (`console.log` no
    # webhook de mensagens). Sem log de contêiner, isso não fica guardado na VM (RNF01). Para
    # investigar algo, troque por `driver: local` por pouco tempo e volte.
    logging:
      driver: none

volumes:
  lumens-pgdata:
  caddy-data:
  caddy-config:
  # Sessão do WhatsApp. Perder estes volumes só obriga a parear o chip de novo.
  evolution-pgdata:
  evolution-instances:
