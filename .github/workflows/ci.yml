name: CI

# PR cobre o que entra; push na main cobre o merge commit, que não é idêntico a
# nenhum dos pais — dois PRs verdes que se cruzam podem quebrar a main.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  # Para redeployar a homologação depois de ligar a VM: a máquina fica desligada fora
  # de uso para poupar crédito, então o deploy do merge pode ter sido pulado.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Só cancela em PR: num push na main, cancelar deixaria um commit sem veredito,
  # e descobrir qual merge quebrou a main é justamente o motivo desse gatilho.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# O workflow só precisa ler o código.
permissions:
  contents: read

jobs:
  check:
    # ATENÇÃO: este nome é o contexto exigido pelo ruleset `protecao-main`
    # (Settings → Rules → Rulesets → Required status checks → `check`).
    # Renomear aqui sem atualizar lá trava o merge para sempre, esperando um
    # check que nunca mais vai rodar.
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Equivalente ao docker-compose.yml do ambiente local. A partir da T4 é aqui que
    # os testes de integração (migrações, trigger da T5, views da T14) vão rodar.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lumens
          POSTGRES_PASSWORD: lumens_ci
          POSTGRES_DB: lumens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U lumens -d lumens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Validar vínculo com o Jira
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BRANCH: ${{ github.head_ref }}
          TITULO_PR: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          if [[ ! "$BRANCH" =~ (^|/)SCRUM-([0-9]+)(-|$) ]]; then
            echo "::error::A branch deve conter uma chave Jira válida, como feat/SCRUM-82-descricao."
            exit 1
          fi

          chave="SCRUM-${BASH_REMATCH[2]}"
          if [[ "$TITULO_PR" != *"[$chave]"* ]]; then
            echo "::error::O título da PR deve conter [$chave], a mesma chave usada na branch."
            exit 1
          fi

      - uses: actions/checkout@v4

      # Precisa vir ANTES do setup-node: o cache do pnpm não encontra o gerenciador
      # se a ordem for invertida. A versão sai do campo packageManager do package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        id: install
        run: pnpm install --frozen-lockfile

      - name: Checar tipos
        run: pnpm typecheck

      # !cancelled() em vez do padrão: sem isso o primeiro portão vermelho esconde
      # os seguintes, e o lint quebrado só aparece no push depois do typecheck passar.
      - name: Lint
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: pnpm lint

      - name: Formatação
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: pnpm format:check

      - name: Build do site
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: pnpm --filter @lumens/site build

      - name: Build do painel
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: pnpm --filter @lumens/painel build

      # Mesma fonte usada pelo Docker local.
      - name: Criar banco de teste e papéis da aplicação e do site
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        env:
          DATABASE_URL_MIGRACAO: postgresql://lumens:lumens_ci@localhost:5432/lumens
          POSTGRES_APP_PASSWORD: lumens_app_ci
          POSTGRES_SITE_PASSWORD: lumens_site_ci
        run: |
          psql "$DATABASE_URL_MIGRACAO" -v ON_ERROR_STOP=1 -f docker/init/01-cria-banco-de-teste.sql
          pnpm db:provision

      - name: Aplicar migrações do zero
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        env:
          DATABASE_URL_MIGRACAO: postgresql://lumens:lumens_ci@localhost:5432/lumens
        run: pnpm db:migrate

      # As variáveis de banco ficam NESTE step, não no nível do job: o Node dá
      # precedência ao ambiente do processo sobre o --env-file, então defini-las no
      # job faria o step seguinte ignorar o .env justamente nelas — e ele viraria
      # um no-op silencioso.
      - name: Testes
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        env:
          DATABASE_URL: postgresql://lumens_app:lumens_app_ci@localhost:5432/lumens
          DATABASE_URL_LEITURA: postgresql://lumens_site:lumens_site_ci@localhost:5432/lumens
          DATABASE_URL_MIGRACAO: postgresql://lumens:lumens_ci@localhost:5432/lumens
          DATABASE_URL_TESTE: postgresql://lumens:lumens_ci@localhost:5432/lumens_test
          POSTGRES_APP_PASSWORD: lumens_app_ci
          POSTGRES_SITE_PASSWORD: lumens_site_ci
        run: pnpm test

      # Nenhum teste unitário pega o carregamento do .env: carregarEnv() recebe a fonte
      # por parâmetro, então apagar o --env-file do script deixaria os testes verdes e o
      # comando documentado no README mentindo. Este step exercita o caminho de verdade,
      # com o ambiente LIMPO — nenhuma variável do job pode mascarar o arquivo.
      #
      # O .env tem de ficar na raiz do repositório: é o caminho que o script resolve, e
      # validar outro caminho não validaria nada. O step seguinte apaga o arquivo.
      - name: Validar o carregamento do .env
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        timeout-minutes: 2
        run: |
          cp .env.example .env
          node -e "
            const fs = require('fs');
            const crypto = require('crypto');
            const marcadores = ['cole-aqui-32-bytes-em-base64', 'cole-aqui-OUTROS-32-bytes-em-base64'];
            let env = fs.readFileSync('.env', 'utf8');
            for (const marcador of marcadores) {
              if (!env.includes(marcador)) {
                throw new Error('O marcador ' + marcador + ' sumiu do .env.example — atualize este passo do ci.yml.');
              }
              env = env.replace(marcador, crypto.randomBytes(32).toString('base64'));
            }
            fs.writeFileSync('.env', env);
          "
          pnpm --filter @lumens/backend env:check

      # Sempre, inclusive se algo acima falhar: um .env esquecido no workspace vira
      # ambiente fantasma para os steps que a T4 vai acrescentar depois daqui.
      - name: Remover o .env do workspace
        if: ${{ always() }}
        run: rm -f .env

  deploy:
    name: deploy-${{ matrix.projeto }}
    needs: check
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - projeto: site
            project_id_secret: VERCEL_SITE_PROJECT_ID
          - projeto: painel
            project_id_secret: VERCEL_PAINEL_PROJECT_ID
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets[matrix.project_id_secret] }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Validar credenciais da Vercel
        shell: bash
        run: |
          if [[ -z "$VERCEL_TOKEN" || -z "$VERCEL_ORG_ID" || -z "$VERCEL_PROJECT_ID" ]]; then
            echo "::error::Configure VERCEL_TOKEN, VERCEL_ORG_ID e o project ID de ${{ matrix.projeto }} nos secrets do repositório."
            exit 1
          fi

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Carregar configuração de produção
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Gerar build de produção
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Publicar na Vercel
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  # Homologação (SCRUM-93): uma VM com Postgres, back-end e Caddy em docker compose. Hoje no
  # Azure; o docs/homologacao.md explica por que não é AWS. Nada aqui depende do provedor.
  #
  # Separado do job `deploy` porque publica outra coisa, noutro lugar, e a falha de um não
  # deve esconder a do outro — site na Vercel e back-end na VM caem por motivos diferentes.
  deploy-backend:
    name: deploy-backend
    needs: check
    if: >-
      ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SSH_HOST: ${{ secrets.HOMOLOG_SSH_HOST }}
      SSH_USUARIO: ${{ secrets.HOMOLOG_SSH_USUARIO }}
      SSH_CHAVE: ${{ secrets.HOMOLOG_SSH_CHAVE }}
      SSH_KNOWN_HOSTS: ${{ secrets.HOMOLOG_SSH_KNOWN_HOSTS }}
      DOMINIO: ${{ secrets.HOMOLOG_DOMINIO }}

    steps:
      - name: Validar credenciais do servidor
        shell: bash
        run: |
          faltando=()
          for nome in SSH_HOST SSH_USUARIO SSH_CHAVE SSH_KNOWN_HOSTS DOMINIO; do
            if [[ -z "${!nome}" ]]; then faltando+=("HOMOLOG_$nome"); fi
          done
          if (( ${#faltando[@]} > 0 )); then
            echo "::error::Configure nos secrets do repositório: ${faltando[*]}"
            exit 1
          fi

      - name: Preparar o acesso SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_CHAVE" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # known_hosts vem de secret, não de ssh-keyscan: keyscan confia em quem responder
          # naquele instante, o que aceitaria um servidor trocado sem nenhum aviso.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Conferir se a homologação está ligada
        id: alcance
        shell: bash
        run: |
          # A VM fica desligada fora de uso para não queimar o crédito do Azure. Falhar o job
          # por causa disso pintaria a main de vermelho sem ninguém ter errado nada — e CI que
          # fica vermelho por motivo normal é CI que todo mundo aprende a ignorar.
          #
          # Então aqui a homologação desligada é aviso, não erro: o merge segue verde e quem
          # precisar sobe a VM e dispara este workflow pelo botão "Run workflow".
          if timeout 20 bash -c "cat < /dev/null > /dev/tcp/$SSH_HOST/22" 2>/dev/null; then
            echo "ligada=sim" >> "$GITHUB_OUTPUT"
          else
            echo "ligada=nao" >> "$GITHUB_OUTPUT"
            echo "::warning title=Homologação desligada::A VM não respondeu na porta 22. Ligue a máquina no portal do Azure e rode este workflow em Actions > CI > Run workflow. O código desta execução NÃO foi publicado."
          fi

      - name: Publicar e migrar
        if: ${{ steps.alcance.outputs.ligada == 'sim' }}
        shell: bash
        env:
          SHA: ${{ github.sha }}
        run: |
          # O SHA exato que passou no `check`, não `origin/main`: entre o fim do check e
          # este passo pode entrar outro merge, e subiria código que ninguém testou.
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$SSH_USUARIO@$SSH_HOST" \
            "/opt/lumens/scripts/deploy-homologacao.sh '$SHA'"

      - name: Smoke test
        if: ${{ steps.alcance.outputs.ligada == 'sim' }}
        shell: bash
        run: |
          # O compose devolve o controle quando o contêiner sobe, não quando o Fastify
          # começa a atender. Daí a espera, em vez de um curl único.
          for tentativa in $(seq 1 10); do
            if curl --fail --silent --show-error --max-time 10 "https://$DOMINIO/saude" \
              | grep -q '"ok":true'; then
              echo "/saude respondeu com o banco de pé."
              break
            fi
            if [[ "$tentativa" -eq 10 ]]; then
              echo "::error::/saude não confirmou o banco depois de 10 tentativas."
              exit 1
            fi
            sleep 6
          done

          # /resumo passa pela conexão de leitura (lumens_site) e pelas views da T14:
          # cobre um caminho que o /saude não toca.
          curl --fail --silent --show-error --max-time 10 -o /dev/null "https://$DOMINIO/resumo"
          echo "/resumo respondeu."
