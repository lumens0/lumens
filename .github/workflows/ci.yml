name: CI

# PR cobre o que entra; push na main cobre o merge commit, que não é idêntico a
# nenhum dos pais — dois PRs verdes que se cruzam podem quebrar a main.
#
# Sem `edited`: editar título ou descrição não muda código, e rodar tudo de novo gastava
# minutos e cancelava o CI do último push. A chave do Jira no título é checada no
# `jira.yml`. `ready_for_review` porque PR em rascunho não roda os jobs (ver `check`).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # Para redeployar a homologação depois de ligar a VM: a máquina fica desligada fora
  # de uso para poupar crédito, então o deploy do merge pode ter sido pulado. Só publica
  # quando disparado da `main` (SCRUM-336); de outra branch, o job `deploy-fora-da-main` avisa.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Só cancela em PR: num push na main, cancelar deixaria um commit sem veredito,
  # e descobrir qual merge quebrou a main é justamente o motivo desse gatilho.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# O workflow só precisa ler o código.
permissions:
  contents: read

jobs:
  # SCRUM-303: o Caddyfile só era testado no deploy, e um erro nele derruba a homologação inteira
  # (API, webhook e painel). Aqui a imagem do próprio Caddy carrega a configuração em cada PR.
  caddy:
    name: caddy
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Validar o Caddyfile
        run: |
          docker run --rm -e DOMINIO=homologacao.example.com \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  check:
    # ATENÇÃO: este nome é o contexto exigido pelo ruleset `protecao-main`
    # (Settings → Rules → Rulesets → Required status checks → `check`).
    # Renomear aqui sem atualizar lá trava o merge para sempre, esperando um
    # check que nunca mais vai rodar.
    name: check
    # PR em rascunho não gasta minutos: o job fica "skipped" e roda de verdade quando a
    # PR é marcada como pronta. Rascunho não pode ser mergeado, então o skip não libera
    # nada; e o `ready_for_review` refaz o check no mesmo commit antes do merge.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    # Instalação, builds e os testes de todos os pacotes passam de 10 min (só o backend leva ~6,5);
    # com 10, o job era cancelado com tudo verde. Na main o job já levava ~14,5 min, colado nos 15, e
    # cada teste novo com banco em memória custa ~3 s no runner: com 15, a PR 239 foi cancelada no
    # meio dos testes do backend, sem nenhuma falha. 25 dá folga sem esconder um teste travado.
    timeout-minutes: 25

    # Equivalente ao docker-compose.yml do ambiente local. A partir da T4 é aqui que
    # os testes de integração (migrações, trigger da T5, views da T14) vão rodar.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lumens
          POSTGRES_PASSWORD: lumens_ci
          POSTGRES_DB: lumens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U lumens -d lumens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v7

      # Precisa vir ANTES do setup-node: o cache do pnpm não encontra o gerenciador
      # se a ordem for invertida. A versão sai do campo packageManager do package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        id: install
        run: pnpm install --frozen-lockfile

      - name: Checar tipos
        run: pnpm typecheck

      # !cancelled() em vez do padrão: sem isso o primeiro portão vermelho esconde
      # os seguintes, e o lint quebrado só aparece no push depois do typecheck passar.
      - name: Lint
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: pnpm lint

      - name: Formatação
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: pnpm format:check

      - name: Build do site
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: pnpm --filter @lumens/site build
        env:
          # Número fictício só para o build do CI: sem ele o next.config.ts falha (SCRUM-43).
          NEXT_PUBLIC_WHATSAPP_BOT: '5500000000000'

      - name: Build do painel
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: pnpm --filter @lumens/painel build

      # Mesma fonte usada pelo Docker local.
      - name: Criar banco de teste e papéis da aplicação e do site
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        env:
          DATABASE_URL_MIGRACAO: postgresql://lumens:lumens_ci@localhost:5432/lumens
          POSTGRES_APP_PASSWORD: lumens_app_ci
          POSTGRES_SITE_PASSWORD: lumens_site_ci
        run: |
          psql "$DATABASE_URL_MIGRACAO" -v ON_ERROR_STOP=1 -f docker/init/01-cria-banco-de-teste.sql
          pnpm db:provision

      - name: Aplicar migrações do zero
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        env:
          DATABASE_URL_MIGRACAO: postgresql://lumens:lumens_ci@localhost:5432/lumens
        run: pnpm db:migrate

      # As variáveis de banco ficam NESTE step, não no nível do job: o Node dá
      # precedência ao ambiente do processo sobre o --env-file, então defini-las no
      # job faria o step seguinte ignorar o .env justamente nelas — e ele viraria
      # um no-op silencioso.
      - name: Testes
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        env:
          DATABASE_URL: postgresql://lumens_app:lumens_app_ci@localhost:5432/lumens
          DATABASE_URL_LEITURA: postgresql://lumens_site:lumens_site_ci@localhost:5432/lumens
          DATABASE_URL_MIGRACAO: postgresql://lumens:lumens_ci@localhost:5432/lumens
          DATABASE_URL_TESTE: postgresql://lumens:lumens_ci@localhost:5432/lumens_test
          POSTGRES_APP_PASSWORD: lumens_app_ci
          POSTGRES_SITE_PASSWORD: lumens_site_ci
        run: pnpm test

      # Nenhum teste unitário pega o carregamento do .env: carregarEnv() recebe a fonte
      # por parâmetro, então apagar o --env-file do script deixaria os testes verdes e o
      # comando documentado no README mentindo. Este step exercita o caminho de verdade,
      # com o ambiente LIMPO — nenhuma variável do job pode mascarar o arquivo.
      #
      # O .env tem de ficar na raiz do repositório: é o caminho que o script resolve, e
      # validar outro caminho não validaria nada. O step seguinte apaga o arquivo.
      - name: Validar o carregamento do .env
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        timeout-minutes: 2
        run: |
          cp .env.example .env
          node -e "
            const fs = require('fs');
            const crypto = require('crypto');
            const marcadores = ['cole-aqui-32-bytes-em-base64', 'cole-aqui-OUTROS-32-bytes-em-base64'];
            let env = fs.readFileSync('.env', 'utf8');
            for (const marcador of marcadores) {
              if (!env.includes(marcador)) {
                throw new Error('O marcador ' + marcador + ' sumiu do .env.example — atualize este passo do ci.yml.');
              }
              env = env.replace(marcador, crypto.randomBytes(32).toString('base64'));
            }
            fs.writeFileSync('.env', env);
          "
          pnpm --filter @lumens/backend env:check

      # Sempre, inclusive se algo acima falhar: um .env esquecido no workspace vira
      # ambiente fantasma para os steps que a T4 vai acrescentar depois daqui.
      - name: Remover o .env do workspace
        if: ${{ always() }}
        run: rm -f .env

  # Ponta a ponta do site (SCRUM-28): a API de leitura real sobre o seed e o site construído.
  # ATENÇÃO: como o `check`, este nome é contexto exigido pelo ruleset `protecao-main`, e os
  # deploys esperam por ele (SCRUM-312). Renomear aqui exige atualizar o ruleset.
  e2e:
    name: e2e
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lumens
          POSTGRES_PASSWORD: lumens_ci
          POSTGRES_DB: lumens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U lumens -d lumens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL_MIGRACAO: postgresql://lumens:lumens_ci@localhost:5432/lumens
      POSTGRES_APP_PASSWORD: lumens_app_ci
      POSTGRES_SITE_PASSWORD: lumens_site_ci

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Instalar o Chromium do Playwright
        run: pnpm --filter @lumens/site exec playwright install --with-deps chromium

      - name: Preparar o banco com o seed
        env:
          DATABASE_URL: postgresql://lumens_app:lumens_app_ci@localhost:5432/lumens
        run: |
          psql "$DATABASE_URL_MIGRACAO" -v ON_ERROR_STOP=1 -f docker/init/01-cria-banco-de-teste.sql
          pnpm db:provision
          pnpm db:migrate
          pnpm db:seed

      - name: Build do site
        run: pnpm --filter @lumens/site build
        env:
          NEXT_PUBLIC_WHATSAPP_BOT: '5500000000000'

      - name: Testes ponta a ponta
        env:
          DATABASE_URL_LEITURA: postgresql://lumens_site:lumens_site_ci@localhost:5432/lumens
        run: pnpm --filter @lumens/site e2e

      - name: Guardar trace e screenshot da falha
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-falhas
          path: apps/site/test-results/
          retention-days: 7

  deploy:
    name: deploy-${{ matrix.projeto }}
    # SCRUM-312: o e2e também, e não em paralelo. O ruleset barra PR com e2e vermelho, mas o
    # merge commit da main não é idêntico a nenhum dos pais e pode quebrar só aqui.
    needs: [check, e2e]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # O painel saiu daqui: ele roda na VM da homologação, ao lado do banco, e é
          # publicado pelo job `deploy-backend`.
          - projeto: site
            project_id_secret: VERCEL_SITE_PROJECT_ID
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets[matrix.project_id_secret] }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Validar credenciais da Vercel
        shell: bash
        run: |
          if [[ -z "$VERCEL_TOKEN" || -z "$VERCEL_ORG_ID" || -z "$VERCEL_PROJECT_ID" ]]; then
            echo "::error::Configure VERCEL_TOKEN, VERCEL_ORG_ID e o project ID de ${{ matrix.projeto }} nos secrets do repositório."
            exit 1
          fi

      # Versão fixa: com `latest`, o build de produção mudava sozinho quando saía CLI nova. Para
      # atualizar, troque aqui e confira o deploy seguinte da main (65.15.0 é a do último que passou).
      - name: Instalar Vercel CLI
        run: npm install --global vercel@65.15.0

      - name: Carregar configuração de produção
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Gerar build de produção
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Publicar na Vercel
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  # Homologação (SCRUM-93): uma VM com Postgres, back-end e Caddy em docker compose. Hoje no
  # Azure; o docs/operacao/homologacao.md explica por que não é AWS. Nada aqui depende do provedor.
  #
  # Separado do job `deploy` porque publica outra coisa, noutro lugar, e a falha de um não
  # deve esconder a do outro — site na Vercel e back-end na VM caem por motivos diferentes.
  deploy-backend:
    name: deploy-backend
    # Como o `deploy`: só publica com o check e o e2e verdes deste mesmo commit (SCRUM-312).
    needs: [check, e2e]
    # Só da `main`, também no Run workflow (SCRUM-336): disparado de outra branch, publicaria e
    # migraria o banco da homologação com código sem revisão — e esse banco não tem backup.
    if: >-
      ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SSH_HOST: ${{ secrets.HOMOLOG_SSH_HOST }}
      SSH_USUARIO: ${{ secrets.HOMOLOG_SSH_USUARIO }}
      SSH_CHAVE: ${{ secrets.HOMOLOG_SSH_CHAVE }}
      SSH_KNOWN_HOSTS: ${{ secrets.HOMOLOG_SSH_KNOWN_HOSTS }}
      DOMINIO: ${{ secrets.HOMOLOG_DOMINIO }}

    steps:
      - name: Validar credenciais do servidor
        shell: bash
        run: |
          faltando=()
          for nome in SSH_HOST SSH_USUARIO SSH_CHAVE SSH_KNOWN_HOSTS DOMINIO; do
            if [[ -z "${!nome}" ]]; then faltando+=("HOMOLOG_$nome"); fi
          done
          if (( ${#faltando[@]} > 0 )); then
            echo "::error::Configure nos secrets do repositório: ${faltando[*]}"
            exit 1
          fi

      - name: Preparar o acesso SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_CHAVE" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # known_hosts vem de secret, não de ssh-keyscan: keyscan confia em quem responder
          # naquele instante, o que aceitaria um servidor trocado sem nenhum aviso.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Conferir se a homologação está ligada
        id: alcance
        shell: bash
        run: |
          # A VM fica desligada fora de uso para não queimar o crédito do Azure. Falhar o job
          # por causa disso pintaria a main de vermelho sem ninguém ter errado nada — e CI que
          # fica vermelho por motivo normal é CI que todo mundo aprende a ignorar.
          #
          # Então aqui a homologação desligada é aviso, não erro: o merge segue verde e quem
          # precisar sobe a VM e dispara este workflow pelo botão "Run workflow".
          if timeout 20 bash -c "cat < /dev/null > /dev/tcp/$SSH_HOST/22" 2>/dev/null; then
            echo "ligada=sim" >> "$GITHUB_OUTPUT"
          else
            echo "ligada=nao" >> "$GITHUB_OUTPUT"
            echo "::warning title=Homologação desligada::A VM não respondeu na porta 22. Ligue a máquina no portal do Azure e rode este workflow em Actions > CI > Run workflow. O código desta execução NÃO foi publicado."
          fi

      - name: Publicar e migrar
        if: ${{ steps.alcance.outputs.ligada == 'sim' }}
        shell: bash
        env:
          SHA: ${{ github.sha }}
        run: |
          # O SHA exato que passou no `check`, não `origin/main`: entre o fim do check e
          # este passo pode entrar outro merge, e subiria código que ninguém testou.
          #
          # VERSAO vai no ambiente da chamada (SCRUM-322): no primeiro deploy depois de uma mudança
          # no script, quem roda é a versão antiga dele, já aberta antes do `git reset`, e ela não
          # sabe calcular a versão. Pelo ambiente, o compose a recebe de qualquer jeito.
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$SSH_USUARIO@$SSH_HOST" \
            "VERSAO='$SHA' /opt/lumens/scripts/deploy-homologacao.sh '$SHA'"

      - name: Smoke test
        if: ${{ steps.alcance.outputs.ligada == 'sim' }}
        shell: bash
        env:
          SHA: ${{ github.sha }}
        run: |
          # O compose devolve o controle quando o contêiner sobe, não quando o Fastify
          # começa a atender. Daí a espera, em vez de um curl único.
          #
          # SCRUM-322: além do banco de pé, o /saude tem de dizer o SHA deste run. Sem isso, um
          # back-end antigo que continuou no ar passaria aqui como se fosse o novo.
          for tentativa in $(seq 1 10); do
            saude=$(curl --fail --silent --show-error --max-time 10 "https://$DOMINIO/saude" || true)
            if grep -q '"ok":true' <<<"$saude" && grep -qF "\"versao\":\"$SHA\"" <<<"$saude"; then
              echo "/saude respondeu com o banco de pé e a versão $SHA."
              break
            fi
            if [[ "$tentativa" -eq 10 ]]; then
              echo "::error::/saude não confirmou o banco e a versão $SHA depois de 10 tentativas. Última resposta: $saude"
              exit 1
            fi
            sleep 6
          done

          # /resumo passa pela conexão de leitura (lumens_site) e pelas views da T14:
          # cobre um caminho que o /saude não toca.
          curl --fail --silent --show-error --max-time 10 -o /dev/null "https://$DOMINIO/resumo"
          echo "/resumo respondeu."

          # /api/auth/providers monta a configuração do login do painel: responde 500 se faltar
          # variável no .env.producao. Na primeira vez o Caddy ainda pode estar emitindo o
          # certificado de painel.<DOMINIO>, daí a espera.
          for tentativa in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 10 -o /dev/null \
              "https://painel.$DOMINIO/api/auth/providers"; then
              echo "Painel respondeu em painel.$DOMINIO."
              break
            fi
            if [[ "$tentativa" -eq 20 ]]; then
              echo "::error::painel.$DOMINIO não respondeu depois de 20 tentativas. Confira o DNS do nome, o AUTH_SECRET do .env.producao e o log do Caddy (docker compose -f docker-compose.prod.yml logs caddy)."
              exit 1
            fi
            sleep 6
          done

          # WhatsApp pela Evolution (SCRUM-341): com a sessão do chip caída o bot fica mudo, e nada
          # mais avisa. 404 = o canal é Meta ou Telegram (ou o back-end ainda é anterior à rota): nada
          # a conferir; com a Evolution configurada a rota sempre existe. A Evolution pode estar
          # reconectando depois do deploy, daí a espera de até 2 min.
          #
          # Anota erro, mas não reprova o job: o deploy já foi feito e o chip caído é problema de
          # operação, como a VM desligada acima. O aviso fica no resumo da execução.
          for tentativa in $(seq 1 20); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 "https://$DOMINIO/saude/whatsapp" || true)
            if [[ "$status" == 404 ]]; then
              echo "WhatsApp não sai pela Evolution: nada a conferir."
              break
            fi
            if [[ "$status" == 200 ]]; then
              echo "Chip da Evolution conectado."
              break
            fi
            if [[ "$tentativa" -eq 20 ]]; then
              echo "::error title=WhatsApp desconectado::O chip da Evolution não está conectado (/saude/whatsapp respondeu $status): o bot não responde. Na VM, veja o log do back-end e docs/operacao/evolution.md (VM desligada)."
              break
            fi
            sleep 6
          done

  # SCRUM-322: um merge na main que não chega à homologação tem de pintar a main de vermelho. Run
  # cancelado não pinta: em 13/11 o `check` de dois merges estourou o timeout de 10 min, os deploys
  # ficaram "skipped" e ninguém viu. Este job falha quando o check ou um deploy foi cancelado; falha
  # de verdade já pinta sozinha. O run da fila que um merge mais novo substitui nem começa, e o mais
  # novo publica tudo: ali não há o que avisar.
  deploy-perdido:
    name: deploy-perdido
    # O e2e entrou nos `needs` dos deploys (SCRUM-312): cancelado, ele também deixa o merge de fora.
    needs: [check, e2e, deploy, deploy-backend]
    if: >-
      ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && (needs.check.result == 'cancelled' || needs.e2e.result == 'cancelled'
      || needs.deploy.result == 'cancelled' || needs.deploy-backend.result == 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Avisar que o merge não foi publicado
        env:
          CHECK: ${{ needs.check.result }}
          E2E: ${{ needs.e2e.result }}
          SITE: ${{ needs.deploy.result }}
          BACKEND: ${{ needs.deploy-backend.result }}
        run: |
          echo "::error title=Merge não publicado::check=$CHECK, e2e=$E2E, deploy-site=$SITE, deploy-backend=$BACKEND. O código deste merge NÃO está na homologação. Reexecute o run (Re-run all jobs) ou dispare Actions > CI > Run workflow na main."
          exit 1

  # Run workflow fora da `main` (SCRUM-336): o `deploy-backend` é pulado, e sem este job o
  # pulo seria silencioso e pareceria que publicou. O aviso deixa claro que nada foi publicado.
  deploy-fora-da-main:
    name: deploy-fora-da-main
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Avisar que o deploy foi ignorado
        run: >-
          echo "::warning title=Deploy ignorado::A homologação só é publicada a partir da main.
          Este Run workflow foi disparado de ${GITHUB_REF} e nada foi publicado.
          Rode de novo escolhendo a branch main."
